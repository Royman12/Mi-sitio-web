<!doctype html>
<!--
  ============================================================
  Archivo      : contacto.html
  Proyecto     : Mi Portafolio Personal
  Autor        : Royman Camilo Erira Benavides
  Descripción  : Página de contacto. Contiene un formulario
                 accesible (nombre, email, asunto y mensaje)
                 para que los visitantes puedan enviar un mensaje.
  Última mod.  : 2026-09-18
  Dependencias : css/estilos.css → Hoja de estilos global
                 js/script.js    → Lógica (modo oscuro, validaciones)
  Nota         : El formulario usa action="#" (no envía a backend
                 real). TODO: conectar a un endpoint o servicio
                 (Formspree, EmailJS, backend propio, etc.).
  ============================================================
-->
<html lang="es">
  <head>
    <!-- Codificación UTF-8 para caracteres especiales -->
    <meta charset="UTF-8" />

    <!-- Viewport: diseño responsive en dispositivos móviles -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Título mostrado en la pestaña del navegador -->
    <title>Contacto</title>

    <!-- Hoja de estilos principal del sitio -->
    <link rel="stylesheet" href="css/estilos.css" />
  </head>

  <body>
    <!-- ============================================================
         BARRA DE NAVEGACIÓN
         ============================================================ -->
    <header>
      <nav>
        <!-- Título / logotipo textual del portafolio -->
        <h1>Mi Portafolio</h1>

        <!-- Menú principal de navegación entre las páginas del sitio -->
        <ul>
          <li><a href="index.html">Inicio</a></li>
          <li><a href="sobre-mi.html">Sobre Mí</a></li>
          <li><a href="hobbies.html">Hobbies</a></li>
          <li><a href="gustos.html">Gustos</a></li>
          <!-- "active" marca visualmente la página actual (Contacto) -->
          <li><a href="contacto.html" class="active">Contacto</a></li>
        </ul>

        <!-- Botón que alterna entre tema claro y oscuro (ver js/script.js) -->
        <button id="btn-modo" class="btn-modo">🌙</button>
      </nav>
    </header>

    <!-- ============================================================
         CONTENIDO PRINCIPAL
         ============================================================ -->
    <main>
      <section class="contacto">
        <h2>¡Hablemos!</h2>
        <p>
          ¿Tienes alguna pregunta, quieres compartir un gusto en común o
          simplemente saludar? ¡Déjame un mensaje!
        </p>

        <!-- ---------- FORMULARIO DE CONTACTO ----------
             action : "#"  → actualmente no envía a ningún backend
             method : POST → método HTTP usado al enviar
             Cada campo va en su propio .campo-formulario para layout
        -->
        <form action="#" method="POST" class="formulario-contacto">
          <!-- Campo: Nombre completo (obligatorio) -->
          <div class="campo-formulario">
            <label for="nombre">Nombre completo:</label>
            <input
              type="text"
              id="nombre"
              name="nombre"
              placeholder="Ej. Ana García"
              required
            />
          </div>

          <!-- Campo: Correo electrónico (obligatorio + validación nativa de email) -->
          <div class="campo-formulario">
            <label for="email">Correo electrónico:</label>
            <input
              type="email"
              id="email"
              name="email"
              placeholder="Ej. ana@correo.com"
              required
            />
          </div>

          <!-- Campo: Asunto (opcional) -->
          <div class="campo-formulario">
            <label for="asunto">Asunto:</label>
            <input
              type="text"
              id="asunto"
              name="asunto"
              placeholder="¿De qué quieres hablar?"
            />
          </div>

          <!-- Campo: Mensaje (obligatorio, multilínea) -->
          <div class="campo-formulario">
            <label for="mensaje">Mensaje:</label>
            <textarea
              id="mensaje"
              name="mensaje"
              rows="5"
              placeholder="Escribe tu mensaje aquí..."
              required
            ></textarea>
          </div>

          <!-- Botón de envío del formulario -->
          <button type="submit" class="btn-enviar">Enviar Mensaje</button>
        </form>
      </section>
    </main>

    <!-- ============================================================
         PIE DE PÁGINA
         ============================================================ -->
    <footer>
      <p>&copy; 2026 - Mi Sitio Web Personal</p>
    </footer>

    <!-- Script al final del body para asegurar que el DOM esté cargado -->
    <script src="js/script.js"></script>
  </body>
</html>
